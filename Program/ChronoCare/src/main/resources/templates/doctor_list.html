<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Orvosi Központ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<div class="d-flex justify-content-between align-items-center mb-4">
  <h2>👨‍⚕️ Páciensek Listája</h2>
  <a href="/" class="btn btn-outline-danger">Kijelentkezés</a>
</div>

<table class="table table-striped shadow-sm">
  <thead class="table-dark">
  <tr>
    <th>ID</th>
    <th>Név</th>
    <th>Kor</th>
    <th>Diagnózis</th>
    <th>Művelet</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="p : ${patients}">
    <td th:text="${p.id}"></td>
    <td th:text="${p.name}"></td>
    <td th:text="${p.age}"></td>
    <td th:text="${p.diagnosis}"></td>
    <td>
      <!-- Itt ugrik a meglévő Dashboardra -->
      <a th:href="@{'/doctor/dashboard/' + ${p.id}}" class="btn btn-sm btn-primary">Megnyitás ➡️</a>
    </td>
  </tr>
  </tbody>
</table>

</body>
</html>
