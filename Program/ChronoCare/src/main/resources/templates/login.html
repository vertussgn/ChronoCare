<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Belépés</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

<div class="card shadow p-4" style="width: 400px;">
    <h3 class="text-center mb-4">🔐 Bejelentkezés</h3>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${param.registered}" class="alert alert-success">Sikeres regisztráció! Kérjük lépjen be.</div>

    <form action="/perform_login" method="post">
        <!-- Rejtett mező, ami megjegyzi, hogy orvos vagy beteg akart-e lenni (a URL-ből jön) -->
        <input type="hidden" name="role" th:value="${param.role != null ? param.role : 'PATIENT'}">

        <div class="mb-3">
            <label>Felhasználónév</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Jelszó</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Belépés</button>
    </form>
    <div class="text-center mt-3">
        <a href="/">Vissza a főoldalra</a>
    </div>
</div>

</body>
</html>
