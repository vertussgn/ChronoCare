<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Regisztráció</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light container mt-5">

<div class="card shadow p-4 mx-auto" style="max-width: 500px;">
  <h3 class="text-center">📝 Páciens Regisztráció</h3>
  <form action="/register" method="post" th:object="${patient}">
    <div class="mb-3">
      <label>Teljes Név</label>
      <input type="text" th:field="*{name}" class="form-control" required>
    </div>
    <div class="mb-3">
      <label>Életkor</label>
      <input type="number" th:field="*{age}" class="form-control" required>
    </div>
    <div class="mb-3">
      <label>Diagnózis (opcionális)</label>
      <input type="text" th:field="*{diagnosis}" class="form-control">
    </div>
    <div class="mb-3">
      <label>Válasszon kezelőorvost</label>
      <select name="doctorId" class="form-select" required>
        <option th:each="doc : ${doctors}"
                th:value="${doc.id}"
                th:text="${doc.name}"></option>
      </select>
    </div>
    <hr>
    <div class="mb-3">
      <label>Felhasználónév</label>
      <input type="text" th:field="*{username}" class="form-control" required>
    </div>
    <div class="mb-3">
      <label>Jelszó</label>
      <input type="password" th:field="*{password}" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-success w-100">Regisztráció</button>
  </form>
</div>

</body>
</html>
