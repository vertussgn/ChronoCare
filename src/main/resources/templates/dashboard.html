<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ChronoCare - Orvosi Műszerfal</title>
    <!-- Bootstrap CDN a profi kinézethez -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Ez a stílus felel a riasztás piros színéért */
        .alert-row {
            background-color: #ffe6e6 !important;
            color: #cc0000;
            font-weight: bold;
            border-left: 5px solid red;
        }
        .header-bg {
            background-color: #0d6efd;
            color: white;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body class="bg-light">

<div class="container mt-4">

    <!-- 1. Fejléc: Beteg adatok -->
    <div class="header-bg shadow-sm">
        <div class="row align-items-center">
            <div class="col-md-8">
                <h1>🏥 Páciens Adatlap</h1>
                <h4>Név: <span th:text="${patient.name}"></span> (Kor: <span th:text="${patient.age}"></span>)</h4>
                <p class="mb-0"><i>Diagnózis: <span th:text="${patient.diagnosis}"></span></i></p>
            </div>
            <div class="col-md-4 text-end">
                <span class="badge bg-warning text-dark fs-6">ID: <span th:text="${patient.id}"></span></span>
            </div>
        </div>
    </div>

    <div class="row">
        <!-- 2. Bal oldal: Szimulációs Panel (Az "IoT eszköz") -->
        <div class="col-md-4">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-dark text-white">
                    ⚙️ IoT Eszköz Szimulátor
                </div>
                <div class="card-body">
                    <p class="small text-muted">Itt generálhatsz új méréseket, mintha az okoseszköz küldené őket.</p>

                    <form action="/simulate/measurement" method="post">
                        <!-- Rejtett mező: melyik beteghez tartozik -->
                        <input type="hidden" name="patientId" th:value="${patient.id}">

                        <div class="mb-3">
                            <label class="form-label">Mérés Típusa:</label>
                            <select name="type" class="form-select">
                                <option value="Vérnyomás">Vérnyomás (sys)</option>
                                <option value="Vércukor">Vércukor</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mért Érték:</label>
                            <input type="number" step="0.1" name="value" class="form-control" placeholder="Pl. 120 vagy 5.5" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">📡 Adat Beküldése</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- 3. Jobb oldal: Mérési Történet és Riasztások -->
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    📊 Mérési Előzmények
                </div>
                <div class="card-body">
                    <table class="table table-hover">
                        <thead>
                        <tr>
                            <th>Időpont</th>
                            <th>Típus</th>
                            <th>Érték</th>
                            <th>Státusz</th>
                        </tr>
                        </thead>
                        <tbody>
                        <!-- Itt iterálunk végig a méréseken -->
                        <!-- Ha kritikus (critical == true), akkor hozzáadjuk az 'alert-row' osztályt -->
                        <tr th:each="m : ${measurements}"
                            th:classappend="${m.critical} ? 'alert-row' : ''">

                            <!-- Dátum formázása -->
                            <td th:text="${#temporals.format(m.timestamp, 'yyyy-MM-dd HH:mm:ss')}"></td>
                            <td th:text="${m.type}"></td>

                            <!-- FIGYELEM: Itt a measuredValue-t hívjuk meg! -->
                            <td th:text="${m.measuredValue}"></td>

                            <td>
                                <span th:if="${m.critical}" class="badge bg-danger">⚠️ RIASZTÁS</span>
                                <span th:unless="${m.critical}" class="badge bg-success">Normál</span>
                            </td>
                        </tr>
                        <!-- Ha nincs adat -->
                        <tr th:if="${#lists.isEmpty(measurements)}">
                            <td colspan="4" class="text-center text-muted">Még nincs rögzített mérés.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
